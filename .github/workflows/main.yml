
name: Build Apptainer Images

on:
  # Manual execution through GitHub Actions
  workflow_dispatch:

  # Execute only when a GitHub Release is published
  release:
    types: [published]
permissions:
  contents: read

jobs:
  build:
    name: Build upstream images
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Build images sequentially
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p dist

          recipes=(src/*_upstream.def)

          if [ "${#recipes[@]}" -ne 2 ]; then
            echo "Expected exactly 2 recipes, found ${#recipes[@]}"
            exit 1
          fi

          for recipe in "${recipes[@]}"; do
            name=$(basename "$recipe" .def)
            echo "Building $recipe..."
            
            sudo apptainer build \
              "dist/${name}.sif" \
              "$recipe"

            echo "Built dist/${name}.sif"
          done

      - name: Upload built images
        uses: actions/upload-artifact@v4
        with:
          name: apptainer-images
          path: dist/*.sif
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
